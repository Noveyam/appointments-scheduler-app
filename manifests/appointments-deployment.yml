# PROPOSED TEMPLATE. User copies to manifests/ and commits with the host setting.
# Apply only the private rendered output; the renderer verifies the image SHA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointments-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointments
  template:
    metadata:
      labels:
        app: appointments
    spec:
      serviceAccountName: appointments-sa
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: appointments
          image: "766158721264.dkr.ecr.us-east-1.amazonaws.com/containers-image-repository:staging-test-image@__IMAGE_DIGEST__"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: DATABASE_HOST
              value: appointments-db.cgpicy8ae5ob.us-east-1.rds.amazonaws.com
            - name: DATABASE_USER
              value: appointments_admin
            - name: DATABASE_DB_NAME
              value: django_appointments
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,__LOAD_BALANCER_DNS__"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
