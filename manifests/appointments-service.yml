# PROPOSED TEMPLATE. Client CIDR is rendered privately, never committed.
# No loadBalancerClass/NLB annotation: this lab follows the course Classic LB.
apiVersion: v1
kind: Service
metadata:
  name: appointments-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: appointments
  loadBalancerSourceRanges:
    - "__CLIENT_CIDR__"
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
