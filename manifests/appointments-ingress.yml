# Client CIDR is rendered privately before applying this template.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appointments-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/inbound-cidrs: "__CLIENT_CIDR__"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: appointments-service
                port:
                  number: 80
